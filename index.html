<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu site de Noticias</title>
    <link rel="stylesheet" href="./login/estilo.css">
    <script src="./assets/js/login.js" type= "module" ></script>
    <script src="https://kit.fontawesome.com/db00d7d39c.js" crossorigin="anonymous"></script>
</head>

<body>
    <header>
        <div class="logo">
            <h1 class="titulo">Meu Site de Notícias</h1>
        </div>
    </header>

    <div class="container">
        <h1>Login</h1>
        <form>
            <div class="input-grupo">
                <i class="fa-solid fa-envelope"></i>
                <input id="email" type="email" placeholder="Informe seu e-mail"/>
            </div>
            <div class="input-grupo">
                <i class="fa-solid fa-lock"></i>
                <input id="senha" type="password" placeholder="Informe sua senha"/>
            </div>
            <button type="button">
                <i class="fas fa-sign-in-alt"></i>Entrar</button>
        </form>
        <div class="links-auxiliares">
            <a href="#">Esqueceu a senha?</a>
            <span>-</span>
            <a href="#">Registre-se</a>
        </div>
    </div>
</body>

</html>
